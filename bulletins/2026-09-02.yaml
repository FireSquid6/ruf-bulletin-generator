metadata:
  title: "RUF Bulletin - September 2, 2026"
  author: "Reformed University Fellowship"
  subject: "Weekly bulletin"

layout:
  margin_mm: 10
  gutter_mm: 8

output: ../output/bulletin-2026-09-02.pdf

pages:
  # ---------- Front side (two columns) ----------
  - columns:
      # Left column: sermon text + opening song + QR
      - - type: scripture
          label: "Sermon"
          reference: "James 1:2-18"
          text: "(2) Count it all joy, my brothers, when you meet trials of various kinds, (3) for you know that the testing of your faith produces steadfastness. (4) And let steadfastness have its full effect, that you may be perfect and complete, lacking in nothing. (5) If any of you lacks wisdom, let him ask God, who gives generously to all without reproach, and it will be given him. (6) But let him ask in faith, with no doubting, for the one who doubts is like a wave of the sea that is driven and tossed by the wind. (7) For that person must not suppose that he will receive anything from the Lord; (8) he is a double-minded man, unstable in all his ways. (9) Let the lowly brother boast in his exaltation, (10) and the rich in his humiliation, because like a flower of the grass he will pass away. (11) For the sun rises with its scorching heat and withers the grass; its flower falls, and its beauty perishes. So also will the rich man fade away in the midst of his pursuits. (12) Blessed is the man who remains steadfast under trial, for when he has stood the test he will receive the crown of life, which God has promised to those who love him. (13) Let no one say when he is tempted, \u201CI am being tempted by God,\u201D for God cannot be tempted with evil, and he himself tempts no one. (14) But each person is tempted when he is lured and enticed by his own desire. (15) Then desire when it has conceived gives birth to sin, and sin when it is fully grown brings forth death. (16) Do not be deceived, my beloved brothers. (17) Every good gift and every perfect gift is from above, coming down from the Father of lights, with whom there is no variation or shadow due to change. (18) Of his own will he brought us forth by the word of truth, that we should be a kind of firstfruits of his creatures.\u201D"
        - type: song
          title: "It Is Well"
          columns: 1
          parts:
            - text: |
                When peace, like a river,
                Attendeth my way,
                When sorrows like sea billows roll;
                Whatever my lot,
                Thou hast taught me to say,
            - style: chorus
              text: |
                It is well, with my soul.
                It is well, it is well, with my soul.
            - text: |
                Though Satan should buffet,
                Though trials should come,
                Let this blest assurance control,
                That Christ has regarded
                My helpless estate,
                And hath shed His own blood for my soul.
            - text: |
                My sin, oh, the bliss
                Of this glorious thought!
                My sin, not in part but the whole,
                Is nailed to the cross,
                And I bear it no more,
                Praise the Lord, praise the Lord, O my soul!
            - text: |
                And Lord, haste the day
                When my faith shall be sight,
                The clouds be rolled back as a scroll;
                The trump shall resound,
                And the Lord shall descend,
                Even so, it is well with my soul.
        - type: qr
          caption: "Join the GroupMe!"
          path: ../assets/groupme-qr.png
          size_mm: 26

      # Right column: branding + announcements + contacts
      - - type: branding
          path: ../assets/ruf-baylor-logo.png
          max_width_mm: 80
          max_height_mm: 80
        - type: announcements
          title: "Announcements"
          date: "September 2, 2026"
          items:
            - "RUF Lunch - Fridays 11am - 1pm in the SUB!"
            - "Game Night - Friday 9/4 at 7pm in the SUB! Free pizza!"
            - "GroupMe - join the RUF Squad, RUF 4Gals, or RUF Dudes via the QR code on the back."
            - "Redeemer Waco - text Remington for rides at (555) 555-0100"
            - "Follow RUF on Instagram @BaylorRUF"
            - "Prayer group: Foster at 7 PM"
            - "Small groups: check the group me!"
        - type: contacts
          items:
            - name: "Way Rutherford"
              detail: "(502) 403-8765"
            - name: "Lauren Danforth"
              detail: "(920) 918-7330"
            - name: "Will Won"
              detail: "(254) 239-7227"

  # ---------- Back side (two columns) ----------
  - columns:
      # Left column: second song + order of service + scripture
      - - type: song
          title: "O Love That Will Not Let Me Go"
          columns: 1
          parts:
            - text: |
                O Love that will not let me go,
                I rest my weary soul in thee;
                I give thee back the life I owe,
                That in thine ocean depths its flow
                May richer, fuller be.
            - text: |
                O light that followest all my way,
                I yield my flickering torch to thee;
                My heart restores its borrowed ray,
                That in thy sunshine's blaze its day
                May brighter, fairer be.
            - text: |
                O Joy that seekest me through pain,
                I cannot close my heart to thee;
                I trace the rainbow through the rain,
                And feel the promise is not vain,
                That morn shall tearless be.
            - text: |
                O Cross that liftest up my head,
                I dare not ask to fly from thee;
                I lay in dust life's glory dead,
                And from the ground there blossoms red
                Life that shall endless be.
        - type: heading
          text: "Welcome and Announcements"
        - type: heading
          text: "Greet Your Neighbor!"
        - type: scripture
          label: "Scripture Reading"
          reference: "Romans 6:11-14"
          text: "(11) So you also must consider yourselves dead to sin and alive to God in Christ Jesus. (12) Let not sin therefore reign in your mortal body, to make you obey its passions. (13) Do not present your members to sin as instruments for unrighteousness, but present yourselves to God as those who have been brought from death to life, and your members to God as instruments for righteousness. (14) For sin will have no dominion over you, since you are not under law but under grace."
      # Right column: two closing songs
      - - type: song
          title: "Steadfast"
          columns: 2
          parts:
            - label: "1."
              text: |
                I will build my house whether storm or drought
                On the rock that does not move
                I will set my hope in Your love, O Lord
                And Your faithfulness will prove
            - label: "2."
              text: |
                By the word You spoke, all the starry host
                Are called out by name each night
                In Your watchful care, I will rest secure
                As You lead us with Your light
            - label: "3."
              text: |
                I will not trust in the strength of kings
                On Your promise, I will stand
                I will shout for joy, I will raise my voice
                Hallelujah to the Lamb
            - label: "4."
              text: |
                In the moment of emptiness, all was fulfilled
                In the hour of darkness, Your light was revealed
                In the presence of death, Your life was affirmed
                In the absence of holiness, You are still God
            - style: chorus
              text: |
                You are steadfast, steadfast
        - type: heading
          text: "Prayer"
        - type: song
          title: "His Glory and My Good"
          columns: 2
          parts:
            - label: "1."
              text: |
                I have seen my Father's glory
                Revealed in Jesus Christ
                And the more that I behold Him
                The more He satisfies
                When I gaze upon His beauty
                When I see Him as I should
                Then my eyes are lifted upward
                For His glory and my good
            - label: "2."
              text: |
                There is hope in every trial
                For I can trust the Lord
                He will turn my heart towards Him
                And help me bear the thorn
                So in faith I follow Jesus
                On the road not understood
                For I know that He is working
                For His glory and my good
            - label: "3."
              text: |
                To our God be the glory
                To our God be praise
                He alone, the name above all names
                I will boast ever only in the Lord my God
                For I know His glory is my good
            - label: "4."
              text: |
                See the open arms of Jesus
                Upon the cross that day
                What they understood as weakness
                Deserves my every praise
                For the charge that was against me
                It was nailed into the wood
                Yes I know that He has saved me
                For His glory and my good
            - label: "5."
              text: |
                Would I gladly be made nothing
                That Christ would be made more
                Would I seek the only kingdom
                That far outweighs them all
                I will stand before my Father
                Where the faithful saints have stood
                And with joy my heart shall praise Him
                For His glory and my good
