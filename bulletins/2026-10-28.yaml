      - - type: scripture
          label: Sermon
          reference: James 5:1-6
          text: (1) Come now, you rich, weep and howl for the miseries that are coming upon you. (2) Your riches have rotted and your garments are moth-eaten. (3) Your gold and silver have corroded, and their corrosion will be evidence against you and will eat your flesh like fire. You have laid up treasure in the last days. (4) Behold, the wages of the laborers who mowed your fields, which you kept back by fraud, are crying out against you, and the cries of the harvesters have reached the ears of the Lord of hosts. (5) You have lived on the earth in luxury and in self-indulgence. You have fattened your hearts in a day of slaughter. (6) You have condemned and murdered the righteous person. He does not resist you.
