metadata:
  title: "RUF Bulletin - September 9, 2026"
  author: "Reformed University Fellowship"
  subject: "Weekly bulletin"

layout:
  horizontal_margin_mm: 7
  vertical_margin_mm: 4
  gutter_mm: 14

folded: true

output: ../output/bulletin-2026-09-09.pdf

pages:
  # ---------- Front side (two columns) ----------
  - columns:
      # Left column: sermon text + opening song + QR
      - - type: scripture
          label: "Sermon"
          reference: "James 1:18-27"
          text: "(18) Of his own will he brought us forth by the word of truth, that we should be a kind of firstfruits of his creatures. (19) Know this, my beloved brothers: let every person be quick to hear, slow to speak, slow to anger; (20) for the anger of man does not produce the righteousness of God. (21) Therefore put away all filthiness and rampant wickedness and receive with meekness the implanted word, which is able to save your souls. (22) But be doers of the word, and not hearers only, deceiving yourselves. (23) For if anyone is a hearer of the word and not a doer, he is like a man who looks intently at his natural face in a mirror. (24) For he looks at himself and goes away and at once forgets what he was like. (25) But the one who looks into the perfect law, the law of liberty, and perseveres, being no hearer who forgets but a doer who acts, he will be blessed in his doing. (26) If anyone thinks he is religious and does not bridle his tongue but deceives his heart, this person's religion is worthless. (27) Religion that is pure and undefiled before God the Father is this: to visit orphans and widows in their affliction, and to keep oneself unstained from the world."
        - type: song
          song_ref: hast_thou_heard_him
        - type: qr
          size_mm: 26
          items:
            - caption: "Join the GroupMe!"
              path: ../assets/groupme-qr.png
            - caption: "Prayer Requests"
              path: ../assets/prayer-group-qr.png

      # Right column: branding + announcements + contacts
      - - type: branding
          path: ../assets/ruf-baylor-logo.png
          max_width_mm: 80
          max_height_mm: 80
        - type: announcements
          title: "Announcements"
          date: "September 9, 2026"
          items:
            - "RUF Lunch - Fridays 11am - 1pm in the SUB!"
            - "GroupMe - join the RUF Squad, RUF 4Gals, or RUF Dudes via the QR code on the back."
            - "Redeemer Waco - text Remington for rides at (970) 939-3493"
            - "Follow RUF on Instagram @BaylorRUF"
            - "Fall Conference - October 9-11"
            - "Prayer group: Foster at 7 PM"
            - "Girls Bible Study (Ruth) - Wednesdays 4:30 PM at Pinewood"
            - "Freshman Bible Study with Way - Mondays 4:00 PM at Elliston Chapel"
            - "Co-ed Psalmns Study - Thursdays 5:30 PM at Caroline's House"
            - "Guys Bible Study (Ecclesiastes) - Friday 4 PM in the SUB"
        - type: contacts
          items:
            - name: "Way Rutherford"
              detail: "(502) 403-8765"
            - name: "Lauren Danforth"
              detail: "(920) 918-7330"
            - name: "Will Won"
              detail: "(254) 239-7227"

  # ---------- Back side (two columns) ----------
  - columns:
      # Left column: second song + order of service + scripture
      - - type: song
          song_ref: on_jordan_s_stormy_banks
        - type: heading
          text: "Welcome and Announcements"
        - type: heading
          text: "Greet Your Neighbor!"
        - type: scripture
          label: "Scripture Reading"
          reference: "Proverbs 17:3"
          text: "The crucible is for silver, and the furnace is for gold, and the Lord tests hearts."
      # Right column: two closing songs
      - - type: song
          song_ref: his_mercy_is_more
        - type: heading
          text: "Prayer"
        - type: song
          song_ref: tis_so_sweet