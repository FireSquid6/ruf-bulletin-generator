name: CI
on:
  push:
    branches: [website]
  pull_request:
    branches: [website]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ruf_test
          POSTGRES_PASSWORD: ruf_test
          POSTGRES_DB: ruf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruf_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ruf_test:ruf_test@localhost:5432/ruf_test
      TEST_DATABASE_URL: postgres://ruf_test:ruf_test@localhost:5432/ruf_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run --cwd packages/server migrate
      - run: bun run test
