metadata:
  title: "RUF Bulletin - September 16, 2026"
  author: "Reformed University Fellowship"
  subject: "Weekly bulletin"

layout:
  horizontal_margin_mm: 7
  vertical_margin_mm: 4
  gutter_mm: 14

folded: true

output: ../output/bulletin-2026-09-16.pdf

pages:
  # ---------- Front side (two columns) ----------
  - columns:
      # Left column: sermon text + opening song + QR
      - - type: scripture
          label: "Sermon"
          reference: "James 2:1-13"
          text: "(1) My brothers, show no partiality as you hold the faith in our Lord Jesus Christ, the Lord of glory. (2) For if a man wearing a gold ring and fine clothing comes into your assembly, and a poor man in shabby clothing also comes in, (3) and if you pay attention to the one who wears the fine clothing and say, “You sit here in a good place,” while you say to the poor man, “You stand over there,” or, “Sit down at my feet,” (4) have you not then made distinctions among yourselves and become judges with evil thoughts? (5) Listen, my beloved brothers, has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom, which he has promised to those who love him? (6) But you have dishonored the poor man. Are not the rich the ones who oppress you, and the ones who drag you into court? (7) Are they not the ones who blaspheme the honorable name by which you were called? (8) If you really fulfill the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well. (9) But if you show partiality, you are committing sin and are convicted by the law as transgressors. (10) For whoever keeps the whole law but fails in one point has become guilty of all of it. (11) For he who said, “Do not commit adultery,” also said, “Do not murder.” If you do not commit adultery but do murder, you have become a transgressor of the law. (12) So speak and so act as those who are to be judged under the law of liberty. (13) For judgment is without mercy to one who has shown no mercy. Mercy triumphs over judgment."
        - type: song
          song_ref: great_is_thy_faithfulness
        - type: qr
          size_mm: 26
          items:
            - caption: "Join the GroupMe!"
              path: ../assets/groupme-qr.png
            - caption: "Prayer Requests"
              path: ../assets/prayer-group-qr.png

      # Right column: branding + announcements + contacts
      - - type: branding
          path: ../assets/ruf-baylor-logo.png
          max_width_mm: 80
          max_height_mm: 80
        - type: announcements
          title: "Announcements"
          date: "September 16, 2026"
          items:
            - "RUF Lunch - Fridays 11am - 1pm in the SUB!"
            - "GroupMe - join the RUF Squad, RUF 4Gals, or RUF Dudes via the QR code on the back."
            - "Redeemer Waco - text Remington for rides at (970) 939-3493"
            - "Guys Movie + Poker night - THIS FRIDAY 6 pm at Will's house"
            - "Fall Conference - October 9-11"
            - "Prayer group: Foster at 7 PM"
            - "Girls Bible Study (Ruth) - Wednesdays 4:30 PM at Pinewood"
            - "Freshman Bible Study with Way - Mondays 4:00 PM at Elliston Chapel"
            - "Co-ed Psalmns Study - Thursdays 5:30 PM at Caroline's House"
            - "Guys Bible Study (Ecclesiastes) - Friday 4 PM in the SUB"
        - type: contacts
          items:
            - name: "Way Rutherford"
              detail: "(502) 403-8765"
            - name: "Lauren Danforth"
              detail: "(920) 918-7330"
            - name: "Will Won"
              detail: "(254) 239-7227"

  # ---------- Back side (two columns) ----------
  - columns:
      # Left column: second song + order of service + scripture
      - - type: song
          song_ref: how_firm_a_foundation
        - type: heading
          text: "Welcome and Announcements"
        - type: heading
          text: "Greet Your Neighbor!"
        - type: scripture
          label: "Scripture Reading"
          scale: 1.1
          reference: "Romans 8:31-39"
          text: "(31) What then shall we say to these things? If God is for us, who can be against us?(32) He who did not spare his own Son but gave him up for us all, how will he not also with him graciously give us all things? (33) Who shall bring any charge against God's elect? It is God who justifies. (34) Who is to condemn? Christ Jesus is the one who died—more than that, who was raised—who is at the right hand of God, who indeed is interceding for us. (35) Who shall separate us from the love of Christ? Shall tribulation, or distress, or persecution, or famine, or nakedness, or danger, or sword. (36) As it is written, “For your sake we are being killed all the day long; we are regarded as sheep to be slaughtered.” (37) No, in all these things we are more than conquerors through him who loved us. (38) For I am sure that neither death nor life, nor angels nor rulers, nor things present nor things to come, nor powers, (39) nor height nor depth, nor anything else in all creation, will be able to separate us from the love of God in Christ Jesus our Lord."
      # Right column: two closing songs
      - - type: song
          song_ref: all_glory_be_to_christ
        - type: heading
          text: "Prayer"
        - type: song
          song_ref: jesus_paid_it_all