pages:
  - columns:
      - - type: scripture
          label: Sermon
          reference: James 5:7-12
          text: (7) Be patient, therefore, brothers, until the coming of the Lord. See how the farmer waits for the precious fruit of the earth, being patient about it, until it receives the early and the late rains. (8) You also, be patient. Establish your hearts, for the coming of the Lord is at hand. (9) Do not grumble against one another, brothers, so that you may not be judged; behold, the Judge is standing at the door. (10) As an example of suffering and patience, brothers, take the prophets who spoke in the name of the Lord. (11) Behold, we consider those blessed who remained steadfast. You have heard of the steadfastness of Job, and you have seen the purpose of the Lord, how the Lord is compassionate and merciful. (12) But above all, my brothers, do not swear, either by heaven or by earth or by any other oath, but let your “yes” be yes and your “no” be no, so that you may not fall under condemnation.
