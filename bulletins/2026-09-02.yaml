metadata:
  title: "RUF Bulletin - September 2, 2026"
  author: "Reformed University Fellowship"
  subject: "Weekly bulletin"

layout:
  horizontal_margin_mm: 7
  vertical_margin_mm: 4
  gutter_mm: 14

folded: true

output: ../output/bulletin-2026-09-02.pdf

pages:
  # ---------- Front side (two columns) ----------
  - columns:
      # Left column: sermon text + opening song + QR
      - - type: scripture
          label: "Sermon"
          reference: "James 1:2-18"
          text: "(2) Count it all joy, my brothers, when you meet trials of various kinds, (3) for you know that the testing of your faith produces steadfastness. (4) And let steadfastness have its full effect, that you may be perfect and complete, lacking in nothing. (5) If any of you lacks wisdom, let him ask God, who gives generously to all without reproach, and it will be given him. (6) But let him ask in faith, with no doubting, for the one who doubts is like a wave of the sea that is driven and tossed by the wind. (7) For that person must not suppose that he will receive anything from the Lord; (8) he is a double-minded man, unstable in all his ways. (9) Let the lowly brother boast in his exaltation, (10) and the rich in his humiliation, because like a flower of the grass he will pass away. (11) For the sun rises with its scorching heat and withers the grass; its flower falls, and its beauty perishes. So also will the rich man fade away in the midst of his pursuits. (12) Blessed is the man who remains steadfast under trial, for when he has stood the test he will receive the crown of life, which God has promised to those who love him. (13) Let no one say when he is tempted, 'I am being tempted by God,' for God cannot be tempted with evil, and he himself tempts no one. (14) But each person is tempted when he is lured and enticed by his own desire. (15) Then desire when it has conceived gives birth to sin, and sin when it is fully grown brings forth death. (16) Do not be deceived, my beloved brothers. (17) Every good gift and every perfect gift is from above, coming down from the Father of lights, with whom there is no variation or shadow due to change. (18) Of his own will he brought us forth by the word of truth, that we should be a kind of firstfruits of his creatures."
        - type: song
          song_ref: it_is_well
        - type: qr
          caption: "Join the GroupMe!"
          path: ../assets/groupme-qr.png
          size_mm: 26

      # Right column: branding + announcements + contacts
      - - type: branding
          path: ../assets/ruf-baylor-logo.png
          max_width_mm: 80
          max_height_mm: 80
        - type: announcements
          title: "Announcements"
          date: "September 2, 2026"
          items:
            - "RUF Lunch - Fridays 11am - 1pm in the SUB!"
            - "Game Night - Friday 9/4 at 7pm in the SUB! Free pizza!"
            - "GroupMe - join the RUF Squad, RUF 4Gals, or RUF Dudes via the QR code on the back."
            - "Redeemer Waco - text Remington for rides at (555) 555-0100"
            - "Follow RUF on Instagram @BaylorRUF"
            - "Prayer group: Foster at 7 PM"
            - "Small groups: check the group me!"
        - type: contacts
          items:
            - name: "Way Rutherford"
              detail: "(502) 403-8765"
            - name: "Lauren Danforth"
              detail: "(920) 918-7330"
            - name: "Will Won"
              detail: "(254) 239-7227"

  # ---------- Back side (two columns) ----------
  - columns:
      # Left column: second song + order of service + scripture
      - - type: song
          song_ref: o_love_that_will_not_let_me_go
        - type: heading
          text: "Welcome and Announcements"
        - type: heading
          text: "Greet Your Neighbor!"
        - type: scripture
          label: "Scripture Reading"
          reference: "Romans 6:11-14"
          text: "(11) So you also must consider yourselves dead to sin and alive to God in Christ Jesus. (12) Let not sin therefore reign in your mortal body, to make you obey its passions. (13) Do not present your members to sin as instruments for unrighteousness, but present yourselves to God as those who have been brought from death to life, and your members to God as instruments for righteousness. (14) For sin will have no dominion over you, since you are not under law but under grace."
      # Right column: two closing songs
      - - type: song
          song_ref: steadfast
        - type: heading
          text: "Prayer"
        - type: song
          song_ref: his_glory_and_my_good