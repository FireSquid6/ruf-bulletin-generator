metadata:
  title: "RUF Bulletin - October 7, 2026"
  author: "Reformed University Fellowship"
  subject: "Weekly bulletin"

layout:
  horizontal_margin_mm: 7
  vertical_margin_mm: 4
  gutter_mm: 14

folded: true

output: ../output/bulletin-2026-10-07.pdf

pages:
  # ---------- Front side (two columns) ----------
  - columns:
      # Left column: sermon text + opening song + QR
      - - type: scripture
          label: "Sermon"
          reference: "James 3:13-18"
          text: "(13) Who is wise and understanding among you? By his good conduct let him show his works in the meekness of wisdom. (14) But if you have bitter jealousy and selfish ambition in your hearts, do not boast and be false to the truth. (15) This is not the wisdom that comes down from above, but is earthly, unspiritual, demonic. (16) For where jealousy and selfish ambition exist, there will be disorder and every vile practice. (17) But the wisdom from above is first pure, then peaceable, gentle, open to reason, full of mercy and good fruits, impartial and sincere. (18) And a harvest of righteousness is sown in peace by those who make peace."
        - type: song
          song_ref: all_sufficient_merit
        - type: qr
          size_mm: 26
          items:
            - caption: "Join the GroupMe!"
              path: ../assets/groupme-qr.png
            - caption: "Prayer Requests"
              path: ../assets/prayer-group-qr.png

      # Right column: branding + announcements + contacts
      - - type: branding
          path: ../assets/ruf-baylor-logo.png
          max_width_mm: 80
          max_height_mm: 80
        - type: announcements
          title: "Announcements"
          date: "October 7 2026"
          items:
            - "RUF Lunch - Fridays 11am - 1pm in the SUB!"
            - "GroupMe - join the RUF Squad, RUF 4Gals, or RUF Dudes via the QR code on the back."
            - "Redeemer Waco - text Remington for rides at (970) 939-3493"
            - "Fall Conference - THIS WEEKEND - October 9-11"
            - "Pickup Flag Football - After large group tonight"
            - "RUF Kickball Day - Friday 12 PM (Come if you're going to fall con!)"
            - "Prayer group: Foster at 7 PM"
            - "Girls Bible Study (Ruth) - Wednesdays 4:30 PM at Pinewood"
            - "Freshman Bible Study with Way - Mondays 4:00 PM at Elliston Chapel"
            - "Co-ed Psalm Study - Thursdays 5:30 PM at Caroline's House"
            - "Guys Bible Study (Ecclesiastes) - Friday 4 PM in the SUB"
        - type: contacts
          items:
            - name: "Way Rutherford"
              detail: "(502) 403-8765"
            - name: "Lauren Danforth"
              detail: "(920) 918-7330"
            - name: "Will Won"
              detail: "(254) 239-7227"

  # ---------- Back side (two columns) ----------
  - columns:
      # Left column: second song + order of service + scripture
      - - type: song
          song_ref: how_firm_a_foundation_2026-10-07
        - type: heading
          text: "Welcome and Announcements"
        - type: heading
          text: "Greet Your Neighbor!"
        - type: scripture
          label: "Scripture Reading"
          scale: 1.1
          reference: "Galatians 5:22-26"
          text: "(22) But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, (23) gentleness, self-control; against such things there is no law. (24) And those who belong to Christ Jesus have crucified the flesh with its passions and desires. (25) If we live by the Spirit, let us also keep in step with the Spirit. (26) Let us not become conceited, provoking one another, envying one another."
      # Right column: two closing songs
      - - type: song
          song_ref: come_behold_the_wondrous_mystery
        - type: heading
          text: "Prayer"
        - type: song
          song_ref: goodness_of_jesus