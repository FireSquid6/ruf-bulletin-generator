# Change app and APP_URL together to your globally unique Fly app name.
app = "ruf-bulletin-generator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "bun run --cwd packages/server migrate"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  APP_URL = "https://ruf-bulletin-generator.fly.dev"
  EMAIL_CONFIRMATION = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpus = 1
  cpu_kind = "shared"
