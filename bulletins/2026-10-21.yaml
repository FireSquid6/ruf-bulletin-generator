pages:
  - columns:
      - - type: scripture
          label: Sermon
          reference: James 4:11-17
          text: (11) Do not speak evil against one another, brothers. The one who speaks against a brother or judges his brother, speaks evil against the law and judges the law. But if you judge the law, you are not a doer of the law but a judge. (12) There is only one lawgiver and judge, he who is able to save and to destroy. But who are you to judge your neighbor? (13) Come now, you who say, “Today or tomorrow we will go into such and such a town and spend a year there and trade and make a profit”— (14) yet you do not know what tomorrow will bring. What is your life? For you are a mist that appears for a little time and then vanishes. (15) Instead you ought to say, “If the Lord wills, we will live and do this or that.” (16) As it is, you boast in your arrogance. All such boasting is evil. (17) So whoever knows the right thing to do and fails to do it, for him it is sin.
