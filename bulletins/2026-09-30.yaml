metadata:
  title: "RUF Bulletin - September 30, 2026"
  author: "Reformed University Fellowship"
  subject: "Weekly bulletin"

layout:
  horizontal_margin_mm: 7
  vertical_margin_mm: 4
  gutter_mm: 14

folded: true

output: ../output/bulletin-2026-09-30.pdf

pages:
  # ---------- Front side (two columns) ----------
  - columns:
      # Left column: sermon text + opening song + QR
      - - type: scripture
          label: "Sermon"
          reference: "James 2:14-26"
          text: "(1) Not many of you should become teachers, my brothers, for you know that we who teach will be judged with greater strictness. (2) For we all stumble in many ways. And if anyone does not stumble in what he says, he is a perfect man, able also to bridle his whole body. (3) If we put bits into the mouths of horses so that they obey us, we guide their whole bodies as well. (4) Look at the ships also: though they are so large and are driven by strong winds, they are guided by a very small rudder wherever the will of the pilot directs. (5) So also the tongue is a small member, yet it boasts of great things. How great a forest is set ablaze by such a small fire! (6) And the tongue is a fire, a world of unrighteousness. The tongue is set among our members, staining the whole body, setting on fire the entire course of life, and set on fire by hell. (7) For every kind of beast and bird, of reptile and sea creature, can be tamed and has been tamed by mankind, (8) but no human being can tame the tongue. It is a restless evil, full of deadly poison. (9) With it we bless our Lord and Father, and with it we curse people who are made in the likeness of God. (10) From the same mouth come blessing and cursing. My brothers, these things ought not to be so. (11) Does a spring pour forth from the same opening both fresh and salt water? (12) Can a fig tree, my brothers, bear olives, or a grapevine produce figs? Neither can a salt pond yield fresh water. (13) Who is wise and understanding among you? By his good conduct let him show his works in the meekness of wisdom. (14) But if you have bitter jealousy and selfish ambition in your hearts, do not boast and be false to the truth. (15) This is not the wisdom that comes down from above, but is earthly, unspiritual, demonic. (16) For where jealousy and selfish ambition exist, there will be disorder and every vile practice. (17) But the wisdom from above is first pure, then peaceable, gentle, open to reason, full of mercy and good fruits, impartial and sincere. (18) And a harvest of righteousness is sown in peace by those who make peace."
        - type: qr
          size_mm: 26
          items:
            - caption: "Join the GroupMe!"
              path: ../assets/groupme-qr.png
            - caption: "Prayer Requests"
              path: ../assets/prayer-group-qr.png
        - type: song
          title: "We Will Feast in the House of Zion"
          scale: 1.1
          columns: 1
          parts:
            - style: "chorus"
              text: |
                We will feast in the house of Zion
                We will sing with our hearts restored
                "He has done great things," we will say together
                We will feast and weep no more
            - text: |
                We will not be burned by the fire
                He is the Lord, our God
                We are not consumed by the flood
                Upheld, protected, gathered up
            - text: |
                In the dark of night, before the dawn
                My soul, be not afraid
                For the promised morning, O how long?
                O God of Jacob, be my strength

      # Right column: branding + announcements + contacts
      - - type: branding
          path: ../assets/ruf-baylor-logo.png
          max_width_mm: 80
          max_height_mm: 80
        - type: announcements
          title: "Announcements"
          date: "September 30, 2026"
          items:
            - "RUF Lunch - Fridays 11am - 1pm in the SUB!"
            - "GroupMe - join the RUF Squad, RUF 4Gals, or RUF Dudes via the QR code on the back."
            - "Redeemer Waco - text Remington for rides at (970) 939-3493"
            - "Fall Conference - October 9-11"
            - "RUF IM Flag Football Team - Text (512) 571-0405"
            - "Girls Craft Night - October 2nd 6pm"
            - "Prayer group: Foster at 7 PM"
            - "Girls Bible Study (Ruth) - Wednesdays 4:30 PM at Pinewood"
            - "Freshman Bible Study with Way - Mondays 4:00 PM at Elliston Chapel"
            - "Co-ed Psalm Study - Thursdays 5:30 PM at Caroline's House"
            - "Guys Bible Study (Ecclesiastes) - Friday 4 PM in the SUB"
        - type: contacts
          items:
            - name: "Way Rutherford"
              detail: "(502) 403-8765"
            - name: "Lauren Danforth"
              detail: "(920) 918-7330"
            - name: "Will Won"
              detail: "(254) 239-7227"

  # ---------- Back side (two columns) ----------
  - columns:
      # Left column: second song + order of service + scripture
      - - type: song
          title: "All Praise to Him"
          scale: 1.1
          columns: 1
          parts:
            - text: |
                All praise to Him, the God of light
                Who formed the mountains by His might
                All praise to Him who names the stars
                That sing His fame in skies afar
                All praise to Him who reigns in love
                Who guides the galaxies above
                Yet bends to hear our every prayer
                With sovereign pow'r and tender care
            - text: |
                All praise to Him whose love is seen
                In Christ the Son, the Servant King
                Who left behind His glorious throne
                To pay the ransom for His own
                All praise to Him who humbly came
                To bear our sorrow, sin, and shame
                Who lived to die, who died to rise
                The all-sufficient sacrifice
            - text: |
                All praise to Him whose pow'r imparts
                The love of God within our hearts
                The Spirit of all truth and peace
                The fount of joy and holiness
                To Father, Son, and Spirit now
                Our souls we lift, our wills we bow
                To You, the triune God, we raise
                With loving hearts our song of praise
        - type: heading
          text: "Welcome and Announcements"
        - type: heading
          text: "Greet Your Neighbor!"
        - type: scripture
          label: "Scripture Reading"
          scale: 1.1
          reference: "Psalm 8"
          text: |
            (1) O Lord, our Lord,
                how majestic is your name in all the earth!
            You have set your glory above the heavens.
            (2) Out of the mouth of babies and infants,
            you have established strength because of your foes,
                to still the enemy and the avenger.
            (3) When I look at your heavens, the work of your fingers,
                the moon and the stars, which you have set in place,
            (4) what is man that you are mindful of him,
                and the son of man that you care for him?
            (5) Yet you have made him a little lower than the heavenly beings
                and crowned him with glory and honor.
            (6) You have given him dominion over the works of your hands;
                you have put all things under his feet,
            (7) all sheep and oxen,
                and also the beasts of the field,
            (8) the birds of the heavens, and the fish of the sea,
                whatever passes along the paths of the seas.
            (9) O Lord, our Lord,
                how majestic is your name in all the earth!
      # Right column: two closing songs
      - - type: song
          title: "How Deep the Father's Love"
          columns: 1
          scale: 1.1
          parts:
            - text: |
                How deep the Father’s love for us,
                How vast beyond all measure,
                That He should give His only Son
                To make a wretch His treasure.
                How great the pain of searing loss –
                The Father turns His face away,
                As wounds which mar the Chosen One
                Bring many sons to glory.
            - text: |
                Behold the man upon a cross,
                My sin upon His shoulders;
                Ashamed, I hear my mocking voice
                Call out among the scoffers.
                It was my sin that held Him there
                Until it was accomplished;
                His dying breath has brought me life –
                I know that it is finished.
            - text: |
                I will not boast in anything,
                No gifts, no power, no wisdom;
                But I will boast in Jesus Christ,
                His death and resurrection.
                Why should I gain from His reward?
                I cannot give an answer;
                But this I know with all my heart –
                His wounds have paid my ransom.
        - type: heading
          text: "Prayer"
        - type: song
          title: "Behold the Throne of God Above"
          scale: 1.1
          columns: 1
          parts:
            - text: |
                Before the throne of God above
                I have a strong and perfect plea
                A great High Priest whose name is love
                Who ever lives and pleads for me
                My name is graven on His hands
                My name is written on His heart
                I know that while in heav’n He stands
                No tongue can bid me thence depart
                No tongue can bid me thence depart
            - text: |
                When Satan tempts me to despair
                And tells me of the guilt within
                Upward I look and see Him there
                Who made an end to all my sin
                Because the sinless Savior died
                My sinful soul is counted free
                For God the Just is satisfied
                To look on Him and pardon me
                To look on Him and pardon me
            - text: |
                Behold Him there, the risen Lamb
                My perfect, spotless Righteousness
                The great unchangeable I AM
                The King of glory and of grace
                One with Himself, I cannot die
                My soul is purchased by His blood
                My life is hid with Christ on high
                With Christ my Savior and my God
                With Christ my Savior and my God
