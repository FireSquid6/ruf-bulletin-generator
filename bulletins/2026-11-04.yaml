          text: (7) Be still before the Lord and wait patiently for him; fret not yourself over the one who prospers in his way, over the man who carries out evil devices! (8) Refrain from anger, and forsake wrath! Fret not yourself; it tends only to evil. (9) For the evildoers shall be cut off, but those who wait for the Lord shall inherit the land.
