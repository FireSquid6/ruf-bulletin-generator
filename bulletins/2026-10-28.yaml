          reference: 1 Timothy 6:6-10
          text: (6) But godliness with contentment is great gain, (7) for we brought nothing into the world, and we cannot take anything out of the world. (8) But if we have food and clothing, with these we will be content. (9) But those who desire to be rich fall into temptation, into a snare, into many senseless and harmful desires that plunge people into ruin and destruction. (10) For the love of money is a root of all kinds of evils. It is through this craving that some have wandered away from the faith and pierced themselves with many pangs.
