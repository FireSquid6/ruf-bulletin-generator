        - type: scripture
          label: Scripture Reading
          scale: 1.1
          reference: 1 Kings 17:17-24
          text: (17) After this the son of the woman, the mistress of the house, became ill. And his illness was so severe that there was no breath left in him. (18) And she said to Elijah, “What have you against me, O man of God? You have come to me to bring my sin to remembrance and to cause the death of my son!” (19) And he said to her, “Give me your son.” And he took him from her arms and carried him up into the upper chamber where he lodged, and laid him on his own bed. (20) And he cried to the Lord, “O Lord my God, have you brought calamity even upon the widow with whom I sojourn, by killing her son?” (21) Then he stretched himself upon the child three times and cried to the Lord, “O Lord my God, let this child's life come into him again.” (22) And the Lord listened to the voice of Elijah. And the life of the child came into him again, and he revived. (23) And Elijah took the child and brought him down from the upper chamber into the house and delivered him to his mother. And Elijah said, “See, your son lives.” (24) And the woman said to Elijah, “Now I know that you are a man of God, and that the word of the Lord in your mouth is truth.”
