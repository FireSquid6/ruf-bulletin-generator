          text: (23) Keep your heart with all vigilance, for from it flow the springs of life. (24) Put away from you crooked speech, and put devious talk far from you. (25) Let your eyes look directly forward, and your gaze be straight before you. (26) Ponder the path of your feet; then all your ways will be sure. (27) Do not swerve to the right or to the left; turn your foot away from evil.
