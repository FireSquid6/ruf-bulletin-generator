          reference: 2 Peter 1:3-8
          text: (3) His divine power has granted to us all things that pertain to life and godliness, through the knowledge of him who called us to his own glory and excellence, (4) by which he has granted to us his precious and very great promises, so that through them you may become partakers of the divine nature, having escaped from the corruption that is in the world because of sinful desire. (5) For this very reason, make every effort to supplement your faith with virtue, and virtue with knowledge, (6) and knowledge with self-control, and self-control with steadfastness, and steadfastness with godliness, (7) and godliness with brotherly affection, and brotherly affection with love. (8) For if these qualities are yours and are increasing, they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus Christ.
